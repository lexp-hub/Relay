<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 52" width="170" height="52">
  <defs>
    <linearGradient id="relay-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="170" height="52" fill="#13151c" rx="4" stroke="#242735" stroke-width="1.5"/>
  
  <!-- Mini Entity-Relationship Connector Nodes Symbol -->
  <g transform="translate(10, 11)">
    <!-- Entity A Box -->
    <rect x="0" y="2" width="12" height="10" rx="1.5" fill="#181a24" stroke="#10b981" stroke-width="1.5"/>
    <!-- Entity B Box -->
    <rect x="18" y="16" width="12" height="10" rx="1.5" fill="#181a24" stroke="#10b981" stroke-width="1.5"/>
    <!-- Connecting Wire (Crow's foot / Relational line) -->
    <path d="M 12 7 L 15 7 L 15 21 L 18 21" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crow's foot fork -->
    <path d="M 15 19 L 18 21 L 15 23" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  
  <!-- Brand Monospace Text -->
  <text x="96" y="34" fill="#10b981" font-family="'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="900" letter-spacing="3" text-anchor="middle">RELAY</text>
  
  <!-- Version Tag / Dot Indicator -->
  <circle cx="150" cy="22" r="3" fill="#34d399"/>
</svg>

